{% extends "base.html" %}
{% block title %}Settings · Yalshi{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px;margin:0 auto;">
  <h2>Profile & privacy</h2>
  <p class="meta">Choose how campus sees you. Your NetID is hidden from profiles and NetID searches while anonymous mode is on.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="display_name">Public display name</label>
    <input id="display_name" name="display_name" value="{{ current_user.display_name }}" maxlength="80" required>

    <label>
      <input type="checkbox" name="is_anonymous_display" {% if current_user.is_anonymous_display %}checked{% endif %} style="width:auto;margin-right:0.4rem;">
      Appear anonymous (hide NetID on profile)
    </label>

    <label>
      <input type="checkbox" name="notify_email" {% if current_user.notify_email %}checked{% endif %} style="width:auto;margin-right:0.4rem;">
      Email market updates ({{ current_user.email }})
    </label>

    <button type="submit">Save</button>
  </form>
</div>

{% endblock %}
