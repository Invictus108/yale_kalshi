{% extends "base.html" %}
{% block title %}Dev login · Yalshi{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:2rem auto;">
  <h2>Dev login</h2>
  <p class="meta">Only when <code>DEV_AUTH_BYPASS=true</code>. For real auth use <a href="{{ url_for('auth.login') }}">CAS</a>.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="netid">NetID</label>
    <input id="netid" name="netid" placeholder="jd0000" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
